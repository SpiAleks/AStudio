<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AStudio | 404 Страница не найдена</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .error-page {
            min-height: 70vh;
            display: flex;
            align-items: center;
        }
        .error-number {
            font-size: 12rem;
            font-weight: 900;
            line-height: 1;
            color: #00d1b2;
            text-shadow: 10px 10px 0 rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .error-number {
                font-size: 8rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar is-light" role="navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="index.html">
                    <strong>AStudio</strong>
                </a>
            </div>
        </div>
    </nav>

    <section class="error-page section">
        <div class="container has-text-centered">
            
            <div class="error-number">404</div>
            
            <h1 class="title is-2 mt-0">Упс! Страница потерялась</h1>
            
            <p class="subtitle is-5 mb-5">
                Возможно, она была удалена или перемещена.<br>
                Но не волнуйтесь, у нас есть много интересного на главной!
            </p>
            
            <div class="buttons is-centered mt-5">
                <a href="index.html" class="button is-primary is-large">
                    <span class="icon">
                        <i class="fas fa-home"></i>
                    </span>
                    <span>На главную</span>
                </a>
                
                <a href="contacts.html" class="button is-light is-large">
                    <span class="icon">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <span>Связаться</span>
                </a>
            </div>
            
            <div class="mt-6">
                <p class="mb-3">Или попробуйте поискать:</p>
                <form class="field has-addons" style="max-width:400px; margin:0 auto;" onsubmit="alert('Поиск пока не работает. Вернитесь на главную!'); return false;">
                    <div class="control is-expanded">
                        <input class="input" type="text" placeholder="Что ищете?">
                    </div>
                    <div class="control">
                        <button class="button is-primary" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="mt-6">
                <p>Полезные разделы:</p>
                <nav class="breadcrumb is-centered mt-3" aria-label="breadcrumbs">
                    <ul>
                        <li><a href="index.html#services">Услуги</a></li>
                        <li><a href="faq.html">FAQ</a></li>
                        <li><a href="contacts.html">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p><strong>AStudio</strong> — дизайн, который работает</p>
            <p class="is-size-7">© 2025 AStudio</p>
        </div>
    </footer>
</body>
</html>
